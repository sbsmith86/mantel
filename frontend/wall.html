<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15171C;
    --lift:#1D212A;
    --paper:#F3F0E9;
    --quiet:#8B909C;
    --hair:rgba(243,240,233,.10);
    --signal:#F0B043;
    --signal-deep:#3A2C11;
    --settled:#7FB3A3;
    --settled-deep:#122C26;
    --p1:#8E9BD6;
    --p2:#7FB3A3;
    --p3:#E0A458;
    --p4:#C9A0C4;
    --gutter:clamp(20px,3.2vw,52px);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Familjen Grotesk",system-ui,sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .board{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:var(--gutter);
    gap:clamp(16px,2.2vh,30px);
  }

  .crown{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
  }

  .date{
    font-size:clamp(26px,3.4vw,54px);
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1;
  }

  .clock{
    font-size:clamp(22px,2.6vw,42px);
    font-weight:400;
    color:var(--quiet);
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }

  .ask{
    border-radius:clamp(10px,1.1vw,18px);
    padding:clamp(16px,2.2vw,34px) clamp(18px,2.4vw,38px);
    background:var(--lift);
    transition:background .5s ease,color .5s ease;
  }

  .ask[data-tone="calm"]{background:transparent;padding-left:0;padding-right:0}
  .ask[data-tone="open"]{background:var(--signal);color:var(--signal-deep)}
  .ask[data-tone="settled"]{background:var(--settled);color:var(--settled-deep)}

  .ask-kicker{
    font-size:clamp(13px,1.15vw,19px);
    font-weight:500;
    opacity:.72;
    margin-bottom:.45em;
  }

  .ask[data-tone="calm"] .ask-kicker{display:none}

  .ask-line{
    font-size:clamp(24px,3.1vw,50px);
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1.12;
  }

  .ask[data-tone="calm"] .ask-line{
    font-weight:400;
    color:var(--quiet);
    letter-spacing:-.01em;
    font-size:clamp(20px,2.3vw,36px);
  }

  .ask-why{
    font-size:clamp(14px,1.35vw,23px);
    margin-top:.5em;
    opacity:.78;
    line-height:1.4;
  }

  .ask[data-tone="calm"] .ask-why{display:none}

  .people{
    flex:1;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    align-content:start;
    column-gap:clamp(20px,3vw,56px);
  }

  .who{
    display:flex;
    align-items:center;
    gap:clamp(12px,1.3vw,22px);
    padding:clamp(11px,1.5vh,22px) 0;
    border-top:1px solid var(--hair);
    transition:opacity .45s ease;
  }

  .disc{
    width:clamp(34px,3.1vw,54px);
    height:clamp(34px,3.1vw,54px);
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(14px,1.3vw,22px);
    font-weight:600;
    color:var(--ink);
  }

  .who-name{
    font-size:clamp(17px,1.75vw,30px);
    font-weight:500;
    letter-spacing:-.01em;
    line-height:1.15;
  }

  .who-state{
    font-size:clamp(14px,1.35vw,23px);
    color:var(--quiet);
    line-height:1.3;
    margin-top:.12em;
    transition:color .45s ease;
  }

  .who[data-flag="true"] .who-state{color:var(--signal)}
  .who[data-flag="fixed"] .who-state{color:var(--settled)}

  .trace{
    border-top:1px solid var(--hair);
    padding-top:clamp(10px,1.4vh,20px);
    display:flex;
    align-items:center;
    gap:.6em;
    font-size:clamp(13px,1.15vw,20px);
    color:var(--quiet);
    min-height:1.6em;
  }

  .pip{
    width:.55em;
    height:.55em;
    border-radius:50%;
    background:var(--quiet);
    flex-shrink:0;
  }

  .trace[data-live="true"] .pip{background:var(--signal);animation:breathe 1.9s ease-in-out infinite}

  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.25}}

  .cue{
    position:fixed;
    right:10px;
    bottom:10px;
    width:14px;
    height:14px;
    border-radius:50%;
    border:1px solid var(--hair);
    background:transparent;
    cursor:pointer;
    opacity:.35;
  }

  .cue:focus-visible{outline:2px solid var(--signal);outline-offset:3px;opacity:1}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }

  @media (max-width:640px){
    .people{grid-template-columns:minmax(0,1fr)}
    body{overflow:auto}
    html,body{height:auto;min-height:100%}
  }
</style>
</head>
<body>

<div class="board">

  <div class="crown">
    <div class="date" id="date">Thursday 20 March</div>
    <div class="clock" id="clock">3:42</div>
  </div>

  <div class="ask" id="ask" data-tone="calm">
    <div class="ask-kicker" id="askKicker">Needs a person</div>
    <div class="ask-line" id="askLine">Everyone's covered today.</div>
    <div class="ask-why" id="askWhy"></div>
  </div>

  <div class="people" id="people"></div>

  <div class="trace" id="trace" data-live="false">
    <span class="pip"></span>
    <span id="traceText">Watching the calendar.</span>
  </div>

</div>

<button class="cue" id="cue" aria-label="Advance the demo"></button>

<script>
const HUES = ['--p1','--p2','--p3','--p4'];

const world = {
  today: 'Thursday 20 March',
  people: [
    { id:'maya',  name:'Maya',  state:'Soccer until 3:45, Kirkwood field' },
    { id:'dana',  name:'Dana',  state:'Calls until 4:30' },
    { id:'sam',   name:'Sam',   state:'Office until 6:00' },
    { id:'jonah', name:'Jonah', state:'Home, permission slip signed' }
  ],
  ask: null,
  trace: 'Watching the calendar.',
  live: false
};

function render(){
  document.getElementById('date').textContent = world.today;

  const ask = document.getElementById('ask');
  if(world.ask){
    ask.dataset.tone = world.ask.tone;
    document.getElementById('askKicker').textContent = world.ask.kicker;
    document.getElementById('askLine').textContent = world.ask.line;
    document.getElementById('askWhy').textContent = world.ask.why || '';
  } else {
    ask.dataset.tone = 'calm';
    document.getElementById('askLine').textContent = "Everyone's covered today.";
    document.getElementById('askWhy').textContent = '';
  }

  const grid = document.getElementById('people');
  grid.innerHTML = '';
  world.people.forEach((p,i) => {
    const row = document.createElement('div');
    row.className = 'who';
    if(p.flag) row.dataset.flag = p.flag;

    const disc = document.createElement('div');
    disc.className = 'disc';
    disc.style.background = `var(${HUES[i % HUES.length]})`;
    disc.textContent = p.name.charAt(0);
    disc.setAttribute('aria-hidden','true');

    const col = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'who-name';
    name.textContent = p.name;
    const st = document.createElement('div');
    st.className = 'who-state';
    st.textContent = p.state;
    col.append(name, st);

    row.append(disc, col);
    grid.append(row);
  });

  document.getElementById('traceText').textContent = world.trace;
  document.getElementById('trace').dataset.live = String(world.live);
}

function setPerson(id, patch){
  const p = world.people.find(x => x.id === id);
  if(p) Object.assign(p, patch);
}

const beats = [

  function conflict(){
    setPerson('maya', { state:'Soccer moved to 4:15, Kirkwood field', flag:'true' });
    setPerson('dana', { state:'Calls until 4:30', flag:'true' });
    world.ask = {
      tone:'open',
      kicker:'Needs a person',
      line:"Nobody is covering Maya's pickup at 4:15",
      why:"The game moved 30 minutes. Dana is on calls until 4:30."
    };
    world.trace = 'Asked Dana and Sam. Waiting.';
    world.live = true;
    render();
  },

  function resolved(){
    setPerson('sam', { state:'Leaving at 3:50 to get Maya', flag:'fixed' });
    setPerson('maya', { state:'Soccer until 4:15, Sam is collecting', flag:'fixed' });
    setPerson('dana', { state:'Calls until 4:30', flag:null });
    world.ask = {
      tone:'settled',
      kicker:'Handled',
      line:'Sam is getting Maya at 4:15',
      why:'Sam answered from the office. Dana stays on her calls.'
    };
    world.trace = 'Sam answered. Calendar updated.';
    world.live = false;
    render();
  },

  function calm(){
    world.people.forEach(p => { p.flag = null; });
    setPerson('maya', { state:'Soccer until 3:45, Kirkwood field' });
    setPerson('dana', { state:'Calls until 4:30' });
    setPerson('sam',  { state:'Office until 6:00' });
    world.ask = null;
    world.trace = 'Watching the calendar.';
    world.live = false;
    render();
  }
];

let beat = -1;
function advance(){
  beat = (beat + 1) % beats.length;
  beats[beat]();
}

document.getElementById('cue').addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'ArrowRight'){ e.preventDefault(); advance(); }
  if(e.key === 'r' || e.key === 'R'){ beat = -1; beats[2](); }
});

function tick(){
  const now = new Date();
  let h = now.getHours() % 12; if(h === 0) h = 12;
  document.getElementById('clock').textContent = h + ':' + String(now.getMinutes()).padStart(2,'0');
}
setInterval(tick, 10000);
tick();

render();
</script>

</body>
</html>
